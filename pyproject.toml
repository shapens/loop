[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shapens-loop"
version = "0.1.0"
description = "Minimal, reproducible multi-turn coding RLVR engine & empirical study (PyTorch GRPO + vLLM + hardened sandboxes)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.7",
  "mypy>=1.11",
]
ml = [
  "torch>=2.4",
  "transformers>=4.46",
  "peft>=0.13",
]
modal = [
  "modal>=0.67",
]

[project.scripts]
loop = "loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["modal", "modal.*", "triton", "triton.*", "vllm", "vllm.*", "peft", "transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["loop.modal_app"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["loop.trainer.triton_logprob"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
