<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img" aria-label="Triton Logprob Kernel and tri Run Benchmarks">
<style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }.title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 14.5px; font-weight: 600; fill: #141413; letter-spacing: -0.01em; }.sub { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 11px; fill: #6F6A60; }.ax { font-size: 10px; fill: #6F6A60; }.leg { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 10.5px; fill: #141413; }.lbl { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 500; fill: #141413; }.grid { stroke: #DDD6C9; stroke-width: 1; stroke-dasharray: 2 4; }.axis { stroke: #B8B0A2; stroke-width: 1.2; }</style>
<rect x="0.5" y="0.5" width="879" height="343" rx="6" fill="#F5F2EB" stroke="#DDD6C9"/>
<line x1="440.0" x2="440.0" y1="22" y2="322" stroke="#DDD6C9" stroke-width="1"/>
<text x="26" y="34" class="title">tri run throughput and c=1 latency</text>
<text x="26" y="51" class="sub">Local Seatbelt tri-server vs. tri v1/v2 and remote cloud Modal</text>
